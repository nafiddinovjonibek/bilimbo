{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
    <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
        {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
    </div>
{% endfor %}
