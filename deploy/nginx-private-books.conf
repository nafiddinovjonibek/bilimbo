# Include inside the same server {} block as the Django application.
# These paths contain source/assembled books and must never have a public alias.
# The application reader is served separately at /kutubxona/.
location ~* ^/(kitoblar|private)/ {
    return 404;
}

# Children's voice answers are served only by the authenticated /ovoz/<id>/tinglash/ view.
location ^~ /media/ovoz/ {
    return 404;
}

# If a shared proxy cache is enabled elsewhere, bypass it for library pages.
location ^~ /kutubxona/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
